[accessibility]
ui_scale = 0.7500000037252903

[audio]
enable_sounds = true

[bar.default]
center = [ "audio_visualizer", "media", "audio_visualizer" ]
end = [ "group:g1", "group:g2" ]
margin_edge = 2
margin_ends = 3
radius = 7
scale = 0.7500000037252903
start = [ "workspaces" ]
thickness = 23
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 0.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "battery", "network" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 3

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "notifications", "tray" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 80.0
    box_width = 80.0
    cx = 44.0
    cy = 96.0
    output = "eDP-1"
    placement_height = 800.0
    placement_width = 1280.0
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 96.0
    cy = 192.0
    output = "eDP-1"
    placement_height = 800.0
    placement_width = 1280.0
    rotation = 0.0
    type = "volume"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 80.0
    box_width = 96.0
    cx = 138.5
    cy = 96.0
    output = "eDP-1"
    placement_height = 800.0
    placement_width = 1280.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

[dock]
auto_hide = true
position = "left"
reserve_space = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

