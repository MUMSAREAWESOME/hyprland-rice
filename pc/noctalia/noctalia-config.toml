[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.0
center = [ "group:g6" ]
end = [ "group:g4", "group:g1", "group:g2" ]
margin_edge = 2
margin_ends = 0
radius = 0
start = [ "group:g3", "group:g7", "group:g5" ]
thickness = 30
widget_spacing = 5

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_secondary"
    id = "g1"
    members = [ "bluetooth", "network" ]
    opacity = 1.0
    padding = 8.0
    radius = 2.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_secondary"
    id = "g2"
    members = [ "notifications", "tray", "theme-switcher" ]
    opacity = 1.0
    padding = 6.0
    radius = 2.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_secondary"
    id = "g4"
    members = [ "widget", "bar" ]
    opacity = 1.0
    padding = 6.0
    radius = 2.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_secondary"
    id = "g5"
    members = [ "recorder", "screenshot" ]
    opacity = 1.0
    padding = 8.0
    radius = 2.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    accordion_duration = 125
    border_width = 0.0
    enabled = true
    fill = "on_secondary"
    id = "g3"
    members = [ "clock" ]
    opacity = 1.0
    padding = 10.0
    radius = 2.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_secondary"
    id = "g6"
    members = [ "audio_visualizer", "media", "audio_visualizer" ]
    opacity = 1.0
    padding = 6.0
    radius = 2.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "on_secondary"
    id = "g7"
    members = [ "workspaces" ]
    opacity = 1.0
    padding = 6.0
    radius = 2.0

